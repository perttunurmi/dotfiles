bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g history-limit 10000
set -g aggressive-resize on
set -g status-interval 1
set -g display-time 4000
set -g status-keys emacs
set -g focus-events on
set -s escape-time 0

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

setw -g mode-keys vi
set-window-option -g mode-keys vi

set -g mouse on
set -g set-clipboard external

# pane number display
set -g display-panes-active-colour colour166
set -g display-panes-colour colour1

set -g status-interval 1

set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# set -g status-style 'bg=#333333 fg=#D4C05F'
# set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,} [#(ps aux | wc --lines)] [%H:%M:%S] [%d-%m-%Y]"

set -g status-right ""

unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix
# bind-key f popup -d '#{pane_current_path}' -w 80% -h 80% "bash"
# bind-key f display-popup -d '#{pane_current_path}' -w 80% -h 80% -E $SHELL
bind-key C-t display-popup -d '#{pane_current_path}' -w 90% -h 90% -E btop

# set -g status-justify absolute-centre
set -g focus-events on
set -g status-left-length 99
set -g status-right-length 99
# set-option -g status-position top

set -g status-style bg=default,bright

set -g status-left ""
set -g status-right "[#S]"

set -g window-status-format "-"
set -g window-status-current-format "*"
set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=green}"

set -g window-status-bell-style "fg=red"

set -g pane-border-lines simple

# set -g visual-activity off
# set -g visual-bell off
# set -g visual-silence off
# setw -g monitor-activity off
# set -g bell-action none

bind-key -N "Toggle persistent popup shell" -n M-f if-shell -F '#{==:#{session_name},floating}' {
    detach-client
} {
    popup -E -w 80% -h 80% 'tmux attach -t floating || tmux new -c "#{pane_current_path}" -s floating \;'
}

