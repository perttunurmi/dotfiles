bind r source-file ~/.dotfiles/tmux/tmux.conf

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 3
bind -r L resize-pane -R 3
bind -r K resize-pane -U 3
bind -r J resize-pane -D 3

set -g history-limit 10000
set -g aggressive-resize on
set -g status-interval 1
set -g display-time 4000
set -g status-keys emacs
set -g focus-events on
set -s escape-time 0

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind m new-window -n "test" nvim

set-window-option -g mode-keys vi
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Escape send -X cancel

set -g mouse on
set -g set-clipboard external

# pane number display
set -g display-panes-active-colour colour166
set -g display-panes-colour colour1

set -g status-interval 1

set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# set -g status-style 'bg=#333333 fg=#D4C05F'
# set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,} [#(ps aux | wc --lines)] [%H:%M:%S] [%d-%m-%Y]"

set -g status-right ""

unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix
# bind-key f popup -d '#{pane_current_path}' -w 80% -h 80% "bash"
# bind-key f display-popup -d '#{pane_current_path}' -w 80% -h 80% -E $SHELL
bind-key C-t display-popup -d '#{pane_current_path}' -w 90% -h 90% -E btop

# set -g status-justify absolute-centre
set -g focus-events on
set -g status-left-length 99
set -g status-right-length 99
# set-option -g status-position top

set -g status-style bg=default,bright

set -g status-left ""
set -g status-right "[#S]"

set -g window-status-format "-"
set -g window-status-current-format "*"
set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=green}"

set -g window-status-bell-style "fg=red"

set -g pane-border-lines simple

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

bind-key -N "Toggle persistent popup shell" -n M-f if-shell -F '#{==:#{session_name},floating}' {
    detach-client
} {
    popup -E -w 80% -h 80% 'tmux attach -t floating || tmux new -c "#{pane_current_path}" -s floating \;'
}


set -g pane-border-style fg=colour241
set -g pane-active-border-style fg=colour39

set -g status-justify absolute-centre
setw -g window-status-current-style 'fg=green bold bg=default'
setw -g window-status-style 'fg=default'
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"

set -g status-position top
set -g status-interval 5
set -g status-style 'fg=default bg=default'
set -g message-style 'fg=default,bg=default'
set -g message-command-style reverse
